MAC INVESTING LLC STOCK DASHBOARD 4.0

HTML
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector Matrix Dashboard Pro - View 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #020617; 
            color: #e2e8f0; 
        }
        .shadow-green { box-shadow: 0 0 25px rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4); }
        .shadow-red { box-shadow: 0 0 25px rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); }
        .shadow-yellow { box-shadow: 0 0 25px rgba(234, 179, 8, 0.15); border: 1px solid rgba(234, 179, 8, 0.4); }
        
        .skeleton-shadow { border: 1px dashed rgba(148, 163, 184, 0.3); }

        .card-transition { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .card-transition:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="p-2 sm:p-4 font-sans antialiased w-full">
    <div class="w-full mx-auto">
        <header class="mb-8 flex flex-col md:flex-row items-center justify-between border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-tight">
                    Market Intelligence Matrix
                </h1>
                <p class="text-slate-400 text-sm mt-1">Focus View: High-Speed Intraday & VWAP</p>
            </div>
            <div class="flex items-center space-x-6 mt-4 md:mt-0 bg-slate-900 px-4 py-2 rounded-lg border border-slate-700/50">
                <span id="progressText" class="text-sm font-semibold text-cyan-400 animate-pulse">Initializing Queue...</span>
                <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="checkbox" id="autoRefresh" class="form-checkbox rounded bg-slate-800 border-slate-600 text-cyan-500 focus:ring-cyan-500 focus:ring-offset-slate-900 transition duration-150 ease-in-out">
                    <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Auto-Refresh (5m)</span>
                </label>
            </div>
        </header>
        
        <div id="dashboard" class="space-y-10">
            <!-- Dashboard skeleton injected here -->
        </div>
    </div>

    <script>
        const API_KEY = 'd9pm1shr01qi2fkvbi30d9pm1shr01qi2fkvbi3g';
        
        const stockGroups = {
            "Magnificent 7": ["AAPL", "MSFT", "GOOGL", "AMZN", "META", "TSLA", "NVDA"],
            "Financial Exchange Traded Fund": ["SPY", "QQQ"],
            "Computer Hardware & Peripherals": ["NTAP", "DELL", "SIMO", "LNVGY", "SNDK", "SMCI", "P", "MU", "WDC", "STX", "BLZE", "TACT", "CRCT", "HPQ"],
            "Aerospace & Defense": ["LMT", "RTX", "SPCX", "GE", "HWM", "HEI", "RKLB"],
            "Nuclear & SMR": ["SMR", "CEG", "OKLO", "NNE", "LEU", "BWXT", "TLN"],
            "Semiconductor Equipment, Materials & MFG": ["KLAC", "TSM", "LRCX", "AMAT", "AEHR", "ENTG", "AMKR", "TER", "AVGO", "ASML", "ONTO", "ATEYY"],
            "Data Center & Infrastructure": ["EQIX", "DLR", "IRM", "AMT"],
            "Hyperscalers & Cloud Providers": ["MSFT", "AMZN", "ORCL", "IBM", "CRM", "GOOGL"],
            "Data Center Hardware & Infrastructure Suppliers": ["NVDA", "VRT", "AVGO"],
            "Electrical-Power/Equipment Group": ["AME", "NVT", "SBGSY", "ETN", "VRT"],
            "Elec-Semiconductor Fablss Group": ["AMD", "CRDO", "NVDA", "MRVL", "ARM"],
            "Energy-Alternative/Other Group": ["BE", "GEV", "ENTL", "SMR", "REX", "FCEL"],
            "Computer Software - Enterprise Group:": ["DDOG", "NET", "KARO", "SNOW", "PLTR"],
            "Healthcare - Large Cap": ["LLY", "UNH", "JNJ", "ABBV", "MRK"],
            "Consumer Cyclical - Large Cap": ["HD", "MCD", "NKE", "SBUX", "LOW"],
            "Consumer Defensive - Large Cap": ["WMT", "PG", "COST", "KO", "PEP"],
            "Financials - Large Cap": ["JPM", "V", "MA", "BAC", "WFC"],
            "Utilities - Large Cap": ["NEE", "SO", "DUK", "SRE", "AEP"],
            "Energy - Micro Nuclear": ["OKLO", "NNE", "SMR", "BWXT", "LEU"]
        };

        let totalSymbols = 0;
        let loadedSymbols = 0;
        for (const syms of Object.values(stockGroups)) totalSymbols += syms.length;

        // --- CACHE LAYER ---
        const profileCache = {};

        // --- OPTIMIZATION 1: FINNHUB STRICT QUEUE (1050ms) ---
        const finnhubQueue = [];
        let isProcessingFinnhub = false;

        function enqueueFinnhub(endpoint) {
            return new Promise((resolve) => {
                finnhubQueue.push({ endpoint, resolve });
                if (!isProcessingFinnhub) processFinnhubQueue();
            });
        }

        async function processFinnhubQueue() {
            isProcessingFinnhub = true;
            while (finnhubQueue.length > 0) {
                const { endpoint, resolve } = finnhubQueue.shift();
                try {
                    const response = await fetch(`https://finnhub.io/api/v1${endpoint}&token=${API_KEY}`);
                    resolve(response.ok ? await response.json() : null);
                } catch (e) {
                    console.error("Finnhub API Error:", e);
                    resolve(null);
                }
                await new Promise(r => setTimeout(r, 1050)); 
            }
            isProcessingFinnhub = false;
        }

        // --- OPTIMIZATION 2: YAHOO HIGH-SPEED INTRADAY QUEUE (300ms) ---
        const yahooQueue = [];
        let isProcessingYahoo = false;

        function enqueueYahoo(symbol) {
            return new Promise((resolve) => {
                yahooQueue.push({ symbol, resolve });
                if (!isProcessingYahoo) processYahooQueue();
            });
        }

        async function processYahooQueue() {
            isProcessingYahoo = true;
            while (yahooQueue.length > 0) {
                const { symbol, resolve } = yahooQueue.shift();
                try {
                    // Stripped down to only fetch 15m intraday data
                    const interval = '15m';
                    const range = '5d'; 
                    const cb = Date.now(); 
                    
                    const yfUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=${interval}&range=${range}&includePrePost=true&cb=${cb}`;
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(yfUrl)}`;
                    
                    const response = await fetch(proxyUrl);
                    const data = response.ok ? await response.json() : null;
                    
                    if (data && data.chart && data.chart.result && data.chart.result.length > 0) {
                        const result = data.chart.result[0];
                        const indicators = result.indicators.quote[0];
                        resolve({
                            s: 'ok',
                            t: result.timestamp,
                            c: indicators.close,
                            h: indicators.high,
                            l: indicators.low,
                            v: indicators.volume,
                            meta: result.meta 
                        });
                    } else {
                        resolve(null);
                    }
                } catch (e) {
                    console.error("Yahoo API Error:", e);
                    resolve(null);
                }
                await new Promise(r => setTimeout(r, 300)); 
            }
            isProcessingYahoo = false;
        }

        function initializeUI() {
            const dashboardEl = document.getElementById('dashboard');
            let htmlContent = '';

            for (const [groupName, symbols] of Object.entries(stockGroups)) {
                const safeGroupId = groupName.replace(/\W/g, '');
                
                htmlContent += `
                    <div>
                        <h2 class="text-xl md:text-2xl font-bold text-slate-200 border-b border-slate-700/80 pb-2 mb-6 uppercase tracking-wider pl-2 border-l-4 border-l-cyan-500 rounded-sm bg-gradient-to-r from-slate-800/50 to-transparent">${groupName}</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-6">
                `;
                for (const symbol of symbols) {
                    htmlContent += `
                        <div id="card-${safeGroupId}-${symbol}" class="bg-slate-900/60 rounded-xl p-5 flex flex-col items-center justify-center min-h-[180px] skeleton-shadow relative overflow-hidden">
                            <div class="animate-pulse flex flex-col items-center space-y-4">
                                <div class="w-14 h-14 bg-slate-800 rounded-full border border-slate-700"></div>
                                <div class="text-xl font-bold text-slate-500">Fetching ${symbol}...</div>
                                <div class="text-xs text-slate-600">Gathering datastreams</div>
                            </div>
                        </div>
                    `;
                }
                htmlContent += `</div></div>`;
            }
            dashboardEl.innerHTML = htmlContent;

            for (const [groupName, symbols] of Object.entries(stockGroups)) {
                for (const symbol of symbols) {
                    loadStockData(symbol, groupName);
                }
            }
        }

        async function loadStockData(symbol, groupName) {
            let profilePromise;
            if (profileCache[symbol]) {
                profilePromise = Promise.resolve(profileCache[symbol]);
            } else {
                profilePromise = enqueueFinnhub(`/stock/profile2?symbol=${symbol}`).then(data => {
                    if (data) profileCache[symbol] = data;
                    return data;
                });
            }

            // Stripped out historical API call entirely for maximum speed
            const [profile, quote, intradayCandles] = await Promise.all([
                profilePromise,
                enqueueFinnhub(`/quote?symbol=${symbol}`),
                enqueueYahoo(symbol)
            ]);

            renderCard(symbol, profile, quote, intradayCandles, groupName);
            
            loadedSymbols++;
            const progEl = document.getElementById('progressText');
            if (loadedSymbols < totalSymbols) {
                progEl.innerText = `Updating data... (${loadedSymbols}/${totalSymbols})`;
            } else {
                progEl.innerText = `Matrix Synchronized`;
                progEl.classList.remove('animate-pulse');
                progEl.classList.add('text-green-400');
                setTimeout(() => { progEl.innerText = 'Live'; }, 5000);
            }
        }

        function renderCard(symbol, profile, quote, intradayCandles, groupName) {
            const currentPrice = quote?.c || 0;
            const openPrice = quote?.o || 0;
            const safeGroupId = groupName.replace(/\W/g, '');
            const cardEl = document.getElementById(`card-${safeGroupId}-${symbol}`);
            
            if (!cardEl) return;

            let shadowClass = 'shadow-yellow';
            let arrow = '⬌';
            let arrowColor = 'text-yellow-500';

            if (currentPrice > openPrice) {
                shadowClass = 'shadow-green';
                arrow = '▲';
                arrowColor = 'text-green-400';
            } else if (currentPrice < openPrice) {
                shadowClass = 'shadow-red';
                arrow = '▼';
                arrowColor = 'text-red-400';
            }

            const priceDiff = currentPrice - openPrice;
            const diffSign = priceDiff > 0 ? '+' : (priceDiff < 0 ? '-' : '');
            const diffColor = priceDiff > 0 ? 'text-green-400' : (priceDiff < 0 ? 'text-red-400' : 'text-slate-400');

            // --- BULLETPROOF PRE-MARKET EXTRACTION ---
            let preMarketHTML = '';
            if (intradayCandles && intradayCandles.s === 'ok' && intradayCandles.t && intradayCandles.t.length > 0) {
                const lastTimestamp = intradayCandles.t[intradayCandles.t.length - 1];
                const latestDate = new Date(lastTimestamp * 1000);
                
                const dateStr = latestDate.toLocaleDateString('en-US', { timeZone: 'America/New_York' });
                const preMarketStart = new Date(`${dateStr} 04:00:00 GMT-0400`).getTime() / 1000;
                const preMarketEnd = new Date(`${dateStr} 09:30:00 GMT-0400`).getTime() / 1000;

                let preHigh = -Infinity;
                let preLow = Infinity;
                let preClose = null;

                for (let i = 0; i < intradayCandles.t.length; i++) {
                    const time = intradayCandles.t[i];
                    if (time >= preMarketStart && time < preMarketEnd) {
                        if (intradayCandles.h[i] && intradayCandles.h[i] > preHigh) preHigh = intradayCandles.h[i];
                        if (intradayCandles.l[i] && intradayCandles.l[i] < preLow) preLow = intradayCandles.l[i];
                        if (intradayCandles.c[i] !== null && !isNaN(intradayCandles.c[i])) {
                            preClose = intradayCandles.c[i];
                        }
                    }
                }

                if (preClose !== null && preHigh !== -Infinity && preLow !== Infinity) {
                    preMarketHTML = `
                        <div class="flex items-center justify-between text-xs mb-4 bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50 w-full mt-2">
                            <span class="text-slate-400 uppercase tracking-widest text-[10px] font-bold">Pre-Market <span class="text-[9px] text-slate-500 normal-case">(H/L/C)</span></span>
                            <div class="flex items-center space-x-3 font-medium">
                                <span class="text-[10px] text-slate-500">H: <span class="text-slate-300">$${preHigh.toFixed(2)}</span></span>
                                <span class="text-[10px] text-slate-500">L: <span class="text-slate-300">$${preLow.toFixed(2)}</span></span>
                                <span class="text-[10px] text-slate-500">C: <span class="text-cyan-400 font-bold">$${preClose.toFixed(2)}</span></span>
                            </div>
                        </div>
                    `;
                }
            }

            // --- INTERDAY VWAP ---
            let vwapHTML = `<span class="text-slate-500 font-normal ml-1">N/A</span>`;
            let dtSignalHTML = '';

            if (intradayCandles && intradayCandles.s === 'ok' && intradayCandles.t && intradayCandles.t.length > 0) {
                const lastCandleDate = new Date(intradayCandles.t[intradayCandles.t.length - 1] * 1000).toDateString();
                
                let cumVolPrice = 0;
                let cumVol = 0;

                for (let i = 0; i < intradayCandles.t.length; i++) {
                    const candleDate = new Date(intradayCandles.t[i] * 1000).toDateString();
                    if (candleDate === lastCandleDate) {
                        const h = intradayCandles.h[i] || 0;
                        const l = intradayCandles.l[i] || 0;
                        const c = intradayCandles.c[i] || 0;
                        const v = intradayCandles.v[i] || 0;

                        if (v > 0) {
                            const typicalPrice = (h + l + c) / 3;
                            cumVolPrice += typicalPrice * v;
                            cumVol += v;
                        }
                    }
                }
                
                if (cumVol > 0) {
                    const vwap = cumVolPrice / cumVol;
                    const isAbove = currentPrice >= vwap;
                    const vClass = isAbove ? 'text-green-400 bg-green-900/30' : 'text-red-400 bg-red-900/30';
                    const vLabel = isAbove ? '▲ ABOVE' : '▼ BELOW';

                    let isTrendingUp = false;
                    if (intradayCandles.c && intradayCandles.c.length >= 2) {
                        const lastClose = intradayCandles.c[intradayCandles.c.length - 1];
                        const prevClose = intradayCandles.c[intradayCandles.c.length - 2];
                        isTrendingUp = (currentPrice > lastClose) || (lastClose > prevClose);
                    } else {
                        isTrendingUp = currentPrice > openPrice;
                    }
                    
                    if (!isAbove && isTrendingUp) {
                        dtSignalHTML = `<span class="text-[10px] font-extrabold text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/30 tracking-wider animate-pulse">DAY TRADE BUY Range</span>`;
                    } else {
                        dtSignalHTML = `<span class="text-[10px] font-extrabold text-slate-500 bg-slate-800/50 px-2 py-0.5 rounded border border-slate-700 tracking-wider">Out of Buy Range</span>`;
                    }

                    vwapHTML = `
                        <span class="text-white font-bold ml-1">$${vwap.toFixed(2)}</span>
                        <span class="ml-2 px-1.5 py-0.5 rounded text-[10px] font-extrabold ${vClass}">${vLabel}</span>
                    `;
                }
            }

            const logoSrc = profile?.logo ? profile.logo : `https://ui-avatars.com/api/?name=${symbol}&background=1e293b&color=38bdf8`;
            const compName = profile?.name || 'Unknown Company';

            cardEl.className = `bg-slate-800/80 rounded-2xl p-5 flex flex-col card-transition backdrop-blur-sm border-t border-l border-white/5 relative h-full justify-start ${shadowClass}`;
            cardEl.innerHTML = `
                <div class="flex items-center space-x-3 w-full mb-3">
                    <img src="${logoSrc}" alt="${symbol}" class="w-12 h-12 rounded-full bg-white object-contain p-1 border border-slate-600 flex-shrink-0">
                    <div class="overflow-hidden flex-1">
                        <h3 class="text-xl font-extrabold text-white tracking-tight leading-none">${symbol}</h3>
                        <p class="text-[11px] text-slate-400 truncate w-full mt-1" title="${compName}">${compName}</p>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <div class="flex items-center justify-end space-x-1.5 mb-0.5">
                            <span class="text-2xl font-black text-white">$${currentPrice.toFixed(2)}</span>
                            <span class="text-lg ${arrowColor} pb-1">${arrow}</span>
                        </div>
                        <p class="text-[11px] font-semibold text-cyan-400 uppercase tracking-wider">
                            Open: <span class="text-white">$${openPrice.toFixed(2)}</span> 
                            <span class="${diffColor} font-bold ml-1">(${diffSign}$${Math.abs(priceDiff).toFixed(2)})</span>
                        </p>
                    </div>
                </div>

                ${preMarketHTML}

                <div class="flex items-center justify-between text-xs mt-4 bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50 w-full mt-auto">
                    <span class="text-slate-400 uppercase tracking-widest text-[10px] font-bold">Interday VWAP</span>
                    ${dtSignalHTML}
                    <div class="flex items-center">
                        ${vwapHTML}
                    </div>
                </div>
            `;
        }

        initializeUI();

        setInterval(() => {
            const autoRefresh = document.getElementById('autoRefresh');
            if (autoRefresh && autoRefresh.checked && !isProcessingFinnhub && !isProcessingYahoo) {
                const progEl = document.getElementById('progressText');
                if(progEl) {
                    progEl.innerText = 'Auto-refreshing matrix...';
                    progEl.className = 'text-sm font-semibold text-cyan-400 animate-pulse';
                }
                loadedSymbols = 0;
                for (const [groupName, symbols] of Object.entries(stockGroups)) {
                    for (const symbol of symbols) {
                        loadStockData(symbol, groupName);
                    }
                }
            }
        }, 300000);
    </script>
</body>
</html>
